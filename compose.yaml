# ============================================================
# SOCIALSYNC AI — DOCKER COMPOSE CONFIGURATION
# Production-ready multi-container architecture:
#   - frontend: React SPA served by Nginx (Host Port 5180 -> Container Port 80)
#   - backend: Node.js Express REST API (Host Port 5002 -> Container Port 5002)
#   - postgres: PostgreSQL 16 Alpine (Internal Docker network only, no host port exposed)
# ============================================================

services:
  # ------------------------------------------------------------
  # PostgreSQL 16 Database Service (Internal Docker network only)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: socialsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-socialflow_db}
    # PostgreSQL is isolated to the internal Docker network to avoid host port collisions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - socialsync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-socialflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ------------------------------------------------------------
  # Backend API Service (Node.js + Prisma + FFmpeg)
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialsync-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5002
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/socialflow_db?schema=public}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5180}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5002}
      JWT_SECRET: ${JWT_SECRET:-fallback_secret_change_in_production_2026}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      UPLOAD_DIR: uploads
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Colombo}
      PRISMA_DB_PUSH: ${PRISMA_DB_PUSH:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-5002}:5002"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - socialsync-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------------------------
  # Frontend Service (Vite React + Nginx Reverse Proxy)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    container_name: socialsync-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5180}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - socialsync-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: socialsync_postgres_data
  uploads_data:
    name: socialsync_uploads_data

networks:
  socialsync-network:
    name: socialsync_network
    driver: bridge
