version: '3.8'

services:
  # ------------------------------------------------------------
  # PostgreSQL Database Service
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: socialflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-socialflow_db}
    # Internal database container — host port mapping disabled by default
    # to avoid port collisions on shared VM deployments.
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socialflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
